[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "requestguard"
version = "0.1.9"
description = "Framework-agnostic Python rate limiting with six algorithms, sync and async support, and optional Redis storage."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

keywords = [
    "rate-limiting",
    "rate-limiter",
    "request-limiter",
    "requestguard",
    "python",
    "api",
    "throttling",
    "traffic-control",
    "middleware",
    "decorator",
    "token-bucket",
    "leaky-bucket",
    "fixed-window",
    "distributed-rate-limiting",
    "in-memory",
    "redis",
    "backend",
    "cache",
    "web",
    "http",
    "rest-api",
    "microservices",
    "framework-agnostic",
    "concurrency",
    "api-security",
    "dos-protection",
    "abuse-prevention",
    "request-throttling",
    "traffic-shaping",
    "quota",
    "burst-control",
    "networking",
    "performance",
    "scalability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/AdeelMalik22/rateguard"
Documentation = "https://github.com/AdeelMalik22/rateguard#readme"
Repository = "https://github.com/AdeelMalik22/rateguard"
Issues = "https://github.com/AdeelMalik22/rateguard/issues"
Changelog = "https://github.com/AdeelMalik22/rateguard/blob/master/CHANGELOG.md"


[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24.0",
    "uvicorn>=0.20.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["requestguard*"]


[tool.setuptools.package-data]
requestguard = ["py.typed"]
